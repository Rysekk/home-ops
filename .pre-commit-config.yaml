repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
        args: ['--unsafe', '--allow-multiple-documents']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: sops-encrypted
        name: SOPS files must be encrypted
        # SOPS adds a top-level `sops:` metadata block when it encrypts.
        # --negate makes the hook FAIL when the pattern is NOT found.
        language: pygrep
        entry: '^sops:'
        args: [--negate]
        files: '\.sops\.ya?ml$'

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
