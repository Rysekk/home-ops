---
- name: Read kubeconfig from cp-01
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_server_kubeconfig_raw
  no_log: true

- name: Write homelab kubeconfig on the laptop
  ansible.builtin.copy:
    content: "{{ k3s_server_kubeconfig_raw.content | b64decode
      | regex_replace('https://127\\.0\\.0\\.1:6443', 'https://' ~ ansible_default_ipv4.address ~ ':6443')
      | regex_replace('(?m)^(\\s*-?\\s*)(name|cluster|user|current-context): default$', '\\1\\2: homelab') }}"
    dest: "{{ k3s_server_kubeconfig_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  diff: false
